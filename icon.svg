<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Background Glow & Stars -->
  <circle cx="120" cy="120" r="40" fill="#ffffff" opacity="0.1" />
  <circle cx="410" cy="390" r="60" fill="#ffffff" opacity="0.1" />
  <circle cx="390" cy="110" r="8" fill="#fbbf24" />
  <polygon points="390,95 394,106 405,110 394,114 390,125 386,114 375,110 386,106" fill="#fde047" />

  <!-- Stacked Flashcards -->
  <!-- Back Card (Rotated) -->
  <rect x="150" y="110" width="240" height="300" rx="24" fill="#818cf8" opacity="0.6" transform="rotate(12 270 260)" />

  <!-- Middle Card -->
  <rect x="130" y="110" width="240" height="300" rx="24" fill="#a5b4fc" opacity="0.8" transform="rotate(-6 250 260)" />

  <!-- Front Main Card -->
  <rect x="136" y="106" width="240" height="300" rx="24" fill="url(#cardGrad)" filter="url(#shadow)" />

  <!-- Content on Card -->
  <!-- Big Letter 'V' for Voca -->
  <text x="256" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="90" font-weight="900" fill="#4f46e5" text-anchor="middle">V</text>

  <!-- Sound Wave / Audio Indicator -->
  <g transform="translate(196, 260)" fill="#6366f1">
    <rect x="10" y="20" width="6" height="20" rx="3" />
    <rect x="25" y="10" width="6" height="40" rx="3" />
    <rect x="40" y="0" width="6" height="60" rx="3" fill="#8b5cf6" />
    <rect x="55" y="12" width="6" height="36" rx="3" />
    <rect x="70" y="22" width="6" height="16" rx="3" />
    <rect x="85" y="15" width="6" height="30" rx="3" />
    <rect x="100" y="24" width="6" height="12" rx="3" />
  </g>

  <!-- Star Badge -->
  <circle cx="340" cy="140" r="22" fill="#f59e0b" filter="url(#shadow)" />
  <path d="M340 128 L344 136 L353 137 L346 143 L348 152 L340 147 L332 152 L334 143 L327 137 L336 136 Z" fill="#ffffff" />
</svg>
